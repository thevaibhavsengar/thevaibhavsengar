<svg xmlns="http://www.w3.org/2000/svg" width="800" height="290" viewBox="0 0 800 290" role="img" aria-label="Pinned Repositories">
  <title>Pinned Repositories</title>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .header      { font-size: 14px; font-weight: 600; fill: #e6edf3; }
      .customize   { font-size: 12px; fill: #388bfd; }
      .repo-name   { font-size: 12px; font-weight: 600; fill: #388bfd; }
      .badge       { font-size: 10px; fill: #848d97; }
      .desc        { font-size: 11px; fill: #848d97; }
      .lang-label  { font-size: 11px; fill: #848d97; }
      .card        { fill: #0d1117; stroke: #30363d; stroke-width: 1; rx: 8; }
    </style>
    <clipPath id="clip-c1"><rect x="48" y="52" width="280" height="42"/></clipPath>
    <clipPath id="clip-c2"><rect x="428" y="52" width="280" height="42"/></clipPath>
    <clipPath id="clip-c3"><rect x="48" y="192" width="200" height="14"/></clipPath>
    <clipPath id="clip-c4"><rect x="428" y="192" width="280" height="42"/></clipPath>
  </defs>

  <!-- Background -->
  <rect width="800" height="290" rx="10" fill="#0d1117"/>

  <!-- Header -->
  <text x="16" y="22" class="header">Pinned</text>
  <text x="784" y="22" class="customize" text-anchor="end">Customize your pins</text>

  <!-- ── CARD 1 (top-left) ── -->
  <rect x="12" y="32" width="380" height="118" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <!-- repo icon -->
  <svg x="28" y="46" width="14" height="14" viewBox="0 0 16 16" fill="#848d97">
    <path d="M2 2.5A2.5 2.5 0 0 1 4.5 0h8.75a.75.75 0 0 1 .75.75v12.5a.75.75 0 0 1-.75.75h-2.5a.75.75 0 0 1 0-1.5h1.75v-2h-8a1 1 0 0 0-.714 1.7.75.75 0 1 1-1.072 1.05A2.495 2.495 0 0 1 2 11.5Zm10.5-1h-8a1 1 0 0 0-1 1v6.708A2.486 2.486 0 0 1 4.5 9h8Z"/>
