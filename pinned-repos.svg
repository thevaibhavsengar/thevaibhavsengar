  <rect x="12" y="162" width="380" height="118" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <svg x="28" y="176" width="14" height="14" viewBox="0 0 16 16" fill="#848d97">
    <path d="M2 2.5A2.5 2.5 0 0 1 4.5 0h8.75a.75.75 0 0 1 .75.75v12.5a.75.75 0 0 1-.75.75h-2.5a.75.75 0 0 1 0-1.5h1.75v-2h-8a1 1 0 0 0-.714 1.7.75.75 0 1 1-1.072 1.05A2.495 2.495 0 0 1 2 11.5Zm10.5-1h-8a1 1 0 0 0-1 1v6.708A2.486 2.486 0 0 1 4.5 9h8Z"/>
  </svg>
  <text x="48" y="187" class="repo-name">thevaibhavsengar</text>
  <rect x="48" y="194" width="42" height="16" rx="8" fill="none" stroke="#30363d" stroke-width="1"/>
  <text x="69" y="205" class="badge" text-anchor="middle">Public</text>
  <text x="28" y="230" class="desc">My GitHub profile README — a living document about</text>
  <text x="28" y="244" class="desc">who I am and what I build.</text>

  <!-- ── CARD 4 (bottom-right) ── -->
  <rect x="408" y="162" width="380" height="118" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <svg x="424" y="176" width="14" height="14" viewBox="0 0 16 16" fill="#848d97">
    <path d="M2 2.5A2.5 2.5 0 0 1 4.5 0h8.75a.75.75 0 0 1 .75.75v12.5a.75.75 0 0 1-.75.75h-2.5a.75.75 0 0 1 0-1.5h1.75v-2h-8a1 1 0 0 0-.714 1.7.75.75 0 1 1-1.072 1.05A2.495 2.495 0 0 1 2 11.5Zm10.5-1h-8a1 1 0 0 0-1 1v6.708A2.486 2.486 0 0 1 4.5 9h8Z"/>
  </svg>
  <text x="444" y="187" class="repo-name">Internship-Management-System</text>
  <rect x="444" y="194" width="42" height="16" rx="8" fill="none" stroke="#30363d" stroke-width="1"/>
  <text x="465" y="205" class="badge" text-anchor="middle">Public</text>
  <text x="424" y="230" class="desc">Full-stack React app with JSON Server — separate portals</text>
  <text x="424" y="244" class="desc">for Interns and Mentors with role-based access control.</text>
