  <text x="48" y="57" class="repo-name">Multilingual-Customer-Support-RAG</text>
  <!-- Public badge -->
  <rect x="48" y="64" width="42" height="16" rx="8" fill="none" stroke="#30363d" stroke-width="1"/>
  <text x="69" y="75" class="badge" text-anchor="middle">Public</text>
  <!-- Description -->
  <text x="28" y="100" class="desc">An end-to-end RAG system enabling intelligent customer</text>
  <text x="28" y="114" class="desc">support with citation-backed responses from enterprise</text>
  <text x="28" y="128" class="desc">documents.</text>
